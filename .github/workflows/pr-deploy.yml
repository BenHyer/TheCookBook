name: PR Preview Deploy

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]

# Cancel in-progress deploys when a new push arrives, but never cancel teardown.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  # ── Build & push PR-tagged images ─────────────────────────────────────────
  build-push-pr:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Cookbook.ApiService/Dockerfile
          push: true
          tags: benhyer/cookbook-api:pr-${{ github.event.number }}
          cache-from: type=registry,ref=benhyer/cookbook-api:cache
          cache-to: type=registry,ref=benhyer/cookbook-api:cache,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CookbookMauiBlazor/CookbookMauiBlazor.Web/Dockerfile
          push: true
          tags: benhyer/cookbook-web:pr-${{ github.event.number }}
          cache-from: type=registry,ref=benhyer/cookbook-web:cache
          cache-to: type=registry,ref=benhyer/cookbook-web:cache,mode=max

  # ── Deploy isolated namespace into the cluster ────────────────────────────
  deploy-pr:
    needs: build-push-pr
    runs-on: self-hosted
    env:
      NS: cookbook-pr-${{ github.event.number }}
      IMAGE_TAG: pr-${{ github.event.number }}
      BENCAMPUS_HOST: pr-${{ github.event.number }}.bencampus.duckdns.org
      BENHHOME_HOST: pr-${{ github.event.number }}.benhhome.duckdns.org
      FEATURE_ENABLE_USER_PROFILES: ${{ vars.FEATURE_ENABLE_USER_PROFILES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create namespace
        run: kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f
          -

      - name: Apply secrets
        run: |
          kubectl create secret generic cookbook-secrets \
            --namespace "$NS" \
            --from-literal=ConnectionStrings__sqldb="${{ secrets.DB_CONNECTION_STRING }}" \
            --from-literal=ConnectionStrings__pgdb="Host=${{ secrets.PG_HOST }};Port=${{ secrets.PG_PORT }};Database=${{ secrets.PG_DB }};Username=${{ secrets.PG_USER }};Password=${{ secrets.PG_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --from-literal=AZURE_STORAGE_CONTAINER_NAME="${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}" \
            --from-literal=AZURE_AD_TENANT_ID="${{ secrets.AZURE_AD_TENANT_ID }}" \
            --from-literal=AZURE_AD_CLIENT_ID="${{ secrets.AZURE_AD_CLIENT_ID }}" \
            --from-literal=AZURE_AD_CLIENT_SECRET="${{ secrets.AZURE_AD_CLIENT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply ConfigMap
        # Reuse the production configmap but patch the namespace and point OTEL
        # cross-namespace since the collector lives in the cookbook namespace.
        run: |
          sed \
            -e "s/namespace: cookbook$/namespace: $NS/" \
            -e "s|http://otel-collector:|http://otel-collector.cookbook:|" \
            k8s/configmap.yaml | kubectl apply -f -

      - name: Configure feature flags and schema
        run: |
          FEATURE_ENABLE_USER_PROFILES=${FEATURE_ENABLE_USER_PROFILES:-true}
          kubectl patch configmap cookbook-config -n "$NS" --type merge \
            -p "{\"data\":{\"FeatureFlags__EnableUserProfiles\":\"$FEATURE_ENABLE_USER_PROFILES\",\"AuditDb__Schema\":\"pr_${{ github.event.number }}\"}}"

      - name: Ensure audit schema exists
        run: |
          PGPASSWORD="${{ secrets.PG_PASSWORD }}" psql \
            -h "${{ secrets.PG_HOST }}" \
            -p "${{ secrets.PG_PORT }}" \
            -U "${{ secrets.PG_USER }}" \
            -d "${{ secrets.PG_DB }}" \
            -c "CREATE SCHEMA IF NOT EXISTS \"pr_${{ github.event.number }}\";"

      - name: Apply deployments and services
        # Reuse the production manifests as-is; sed patches the hardcoded
        # namespace and envsubst fills in IMAGE_TAG.
        run: |
          for f in k8s/api-deployment.yaml k8s/api-service.yaml \
                    k8s/web-deployment.yaml k8s/web-service.yaml; do
            sed "s/namespace: cookbook$/namespace: $NS/" "$f" \
              | envsubst '${IMAGE_TAG}' \
              | kubectl apply -f -
          done

      - name: Apply Ingress
        run: |
          kubectl apply -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: cookbook-pr-ingress
            namespace: $NS
            annotations:
              nginx.ingress.kubernetes.io/proxy-body-size: "10m"
              nginx.ingress.kubernetes.io/affinity: "cookie"
              nginx.ingress.kubernetes.io/session-cookie-name: "blazor-affinity"
              nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
              nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
              nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
              nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          spec:
            ingressClassName: nginx
            rules:
            - host: $BENCAMPUS_HOST
              http:
                paths:
                - path: /api
                  pathType: Prefix
                  backend:
                    service:
                      name: cookbook-api
                      port:
                        number: 80
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: cookbook-web
                      port:
                        number: 80
            - host: $BENHHOME_HOST
              http:
                paths:
                - path: /api
                  pathType: Prefix
                  backend:
                    service:
                      name: cookbook-api
                      port:
                        number: 80
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: cookbook-web
                      port:
                        number: 80
          EOF

      - name: Register redirect URIs with Azure
        run: |
          APP_ID="133e5a35-ce6c-4e8f-a764-7008bad72271"
          EXISTING=$(az ad app show --id "$APP_ID" --query "web.redirectUris" -o tsv | grep -v '^$')
          ALL_URIS=$(printf "%s\n" $EXISTING \
            "https://${BENCAMPUS_HOST}/signin-oidc" \
            "https://${BENCAMPUS_HOST}/signout-oidc" \
            "https://${BENHHOME_HOST}/signin-oidc" \
            "https://${BENHHOME_HOST}/signout-oidc" \
            | sort -u | tr '\n' ' ')
          az ad app update --id "$APP_ID" --web-redirect-uris $ALL_URIS

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/cookbook-api -n "$NS" --timeout=120s
          kubectl rollout status deployment/cookbook-web -n "$NS" --timeout=120s

      - name: Debug failed rollout
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -n "$NS" -o wide
          echo "=== API logs (unique errors) ==="
          kubectl logs -n "$NS" -l app=cookbook-api --tail=80 2>&1 \
            | grep -E "^(fail|crit|error):" | sort -u | head -20 || true
          echo "=== Web logs (unique errors) ==="
          kubectl logs -n "$NS" -l app=cookbook-web --tail=80 2>&1 \
            | grep -E "^(fail|crit|error):" | sort -u | head -20 || true
          echo "=== Events ==="
          kubectl get events -n "$NS" --sort-by='.lastTimestamp' \
            | grep -v "^<invalid>" | grep Warning | tail -10

  # ── Post / update a comment with the preview URLs ─────────────────────────
  comment-pr:
    needs: deploy-pr
    if: always() && github.event.action != 'closed' && needs.deploy-pr.result ==
      'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Create or update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-env -->';
            const prNumber = context.issue.number;
            const sha = '${{ github.sha }}'.slice(0, 7);
            const bencampus = `https://pr-${prNumber}.bencampus.duckdns.org`;
            const benhhome  = `https://pr-${prNumber}.benhhome.duckdns.org`;
            const grafana = 'https://cookbook.bencampus.duckdns.org/grafana/d/cookbook-v2/thecookbook?orgId=1&viewPanel=12';

            const body = [
              marker,
              '## Preview Environment Deployed',
              '',
              '| Network | URL |',
              '|---------|-----|',
              `| Campus  | ${bencampus} |`,
              `| Home    | ${benhhome}  |`,
              '',
              `Share-board search logs: ${grafana}`,
              '',
              `Deployed from commit \`${sha}\` — updates automatically on each push.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # ── Tear down the namespace when the PR is closed/merged ──────────────────
  teardown-pr:
    if: github.event.action == 'closed'
    runs-on: self-hosted
    env:
      BENCAMPUS_HOST: pr-${{ github.event.number }}.bencampus.duckdns.org
      BENHHOME_HOST: pr-${{ github.event.number }}.benhhome.duckdns.org

    steps:
      - name: Delete PR namespace
        run: |
          kubectl delete namespace "cookbook-pr-${{ github.event.number }}" --ignore-not-found=true

      - name: Drop audit schema
        run: |
          PGPASSWORD="${{ secrets.PG_PASSWORD }}" psql \
            -h "${{ secrets.PG_HOST }}" \
            -p "${{ secrets.PG_PORT }}" \
            -U "${{ secrets.PG_USER }}" \
            -d "${{ secrets.PG_DB }}" \
            -c "DROP SCHEMA IF EXISTS \"pr_${{ github.event.number }}\" CASCADE;"

      - name: Remove redirect URIs from Azure
        run: |
          APP_ID="133e5a35-ce6c-4e8f-a764-7008bad72271"
          REMAINING=$(az ad app show --id "$APP_ID" --query "web.redirectUris" -o tsv \
            | grep -v '^$' \
            | grep -v "$BENCAMPUS_HOST\|$BENHHOME_HOST")
          az ad app update --id "$APP_ID" --web-redirect-uris $REMAINING

  # ── Update the comment to show the environment is gone ────────────────────
  comment-teardown:
    needs: teardown-pr
    if: always() && github.event.action == 'closed' && needs.teardown-pr.result ==
      'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Update preview comment to removed state
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-env -->';
            const prNumber = context.issue.number;

            const body = [
              marker,
              '## Preview Environment Removed',
              '',
              'The preview environment for this PR has been torn down.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  notify-discord:
    needs: [ build-push-pr, deploy-pr, comment-pr, teardown-pr, comment-teardown ]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord notification
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "❌ **Pipeline Failed**",
              "embeds": [
                {
                  "title": "Build Failed",
                  "description": "**Repository:** ${{ github.repository }}\n**Branch:** ${{ github.ref_name }}\n**Commit:** `${{ github.event.head_commit.message }}`\n**Author:** ${{ github.actor }}",
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "color": 15158332,
                  "fields": [
                    {
                      "name": "Workflow",
                      "value": "${{ github.workflow }}",
                      "inline": true
                    }
                  ]
                }
              ]
            }'
