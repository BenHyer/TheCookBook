name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Packages.props
            **/NuGet.config
            **/global.json

      - name: Restore
        run: |
          dotnet restore Cookbook.ApiService/Cookbook.ApiService.csproj
          dotnet restore Cookbook.Web/Cookbook.Web.csproj

      - name: Build
        run: |
          dotnet build Cookbook.ApiService/Cookbook.ApiService.csproj --configuration Release --no-restore &
          dotnet build Cookbook.Web/Cookbook.Web.csproj --configuration Release --no-restore &
          wait

      - name: Lint (format check)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

            readarray -t api_files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" | grep '^Cookbook.ApiService/.*\.cs$' || true)
            readarray -t web_files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" | grep '^Cookbook.Web/.*\.cs$' || true)

            if [ ${#api_files[@]} -gt 0 ]; then
              dotnet format Cookbook.ApiService/Cookbook.ApiService.csproj --verify-no-changes --no-restore --include "${api_files[@]}"
            fi

            if [ ${#web_files[@]} -gt 0 ]; then
              dotnet format Cookbook.Web/Cookbook.Web.csproj --verify-no-changes --no-restore --include "${web_files[@]}"
            fi

            if [ ${#api_files[@]} -eq 0 ] && [ ${#web_files[@]} -eq 0 ]; then
              echo "No changed C# files in Cookbook.ApiService or Cookbook.Web; skipping format check."
            fi
          else
            dotnet format Cookbook.ApiService/Cookbook.ApiService.csproj --verify-no-changes --no-restore &
            dotnet format Cookbook.Web/Cookbook.Web.csproj --verify-no-changes --no-restore &
            wait
          fi

      - name: Detect test projects
        id: detect_tests
        shell: bash
        run: |
          count=$(find . -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \) | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.detect_tests.outputs.has_tests == 'true'
        shell: bash
        run: |
          while IFS= read -r proj; do
            dotnet test "$proj" --configuration Release --nologo --no-restore
          done < <(find . -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \))

  detect-docker-changes:
    runs-on: ubuntu-latest
    outputs:
      docker_changed: ${{ steps.filter.outputs.docker }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Docker-related changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - '.dockerignore'

  container-validate:
    needs: detect-docker-changes
    if: needs.detect-docker-changes.outputs.docker_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker images
        run: docker compose build --pull api app
