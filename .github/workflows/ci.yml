name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare NuGet cache directory
        shell: bash
        run: mkdir -p "${NUGET_PACKAGES}"

      - name: Detect changed projects
        id: detect_projects
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            changed_files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD")

            build_api=false
            build_web=false

            if echo "$changed_files" | grep -Eq '^(Cookbook.ApiService/|Cookbook.Shared/|Cookbook.ServiceDefaults/)'; then
              build_api=true
            fi

            if echo "$changed_files" | grep -Eq '^(CookbookMauiBlazor/|Cookbook.Shared/|Cookbook.ServiceDefaults/)'; then
              build_web=true
            fi

            echo "build_api=$build_api" >> "$GITHUB_OUTPUT"
            echo "build_web=$build_web" >> "$GITHUB_OUTPUT"
          else
            [ -f "Cookbook.ApiService/Cookbook.ApiService.csproj" ] && echo "build_api=true" >> "$GITHUB_OUTPUT" || echo "build_api=false" >> "$GITHUB_OUTPUT"
            [ -f "CookbookMauiBlazor/CookbookMauiBlazor.Web/CookbookMauiBlazor.Web.csproj" ] && echo "build_web=true" >> "$GITHUB_OUTPUT" || echo "build_web=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Packages.props
            **/NuGet.config
            **/global.json

      - name: Restore
        shell: bash
        run: |
          build_api="${{ steps.detect_projects.outputs.build_api }}"
          build_web="${{ steps.detect_projects.outputs.build_web }}"

          if [ "$build_api" = "true" ] && [ "$build_web" = "true" ]; then
            dotnet restore Cookbook.ApiService/Cookbook.ApiService.csproj &
            dotnet restore CookbookMauiBlazor/CookbookMauiBlazor.Web/CookbookMauiBlazor.Web.csproj &
            wait
          elif [ "$build_api" = "true" ]; then
            dotnet restore Cookbook.ApiService/Cookbook.ApiService.csproj
          elif [ "$build_web" = "true" ]; then
            dotnet restore CookbookMauiBlazor/CookbookMauiBlazor.Web/CookbookMauiBlazor.Web.csproj
          else
            echo "No API/Web-related changes detected; skipping restore."
          fi

      - name: Build
        shell: bash
        run: |
          build_api="${{ steps.detect_projects.outputs.build_api }}"
          build_web="${{ steps.detect_projects.outputs.build_web }}"

          if [ "$build_api" = "true" ] && [ "$build_web" = "true" ]; then
            dotnet build Cookbook.ApiService/Cookbook.ApiService.csproj --configuration Release --no-restore &
            dotnet build CookbookMauiBlazor/CookbookMauiBlazor.Web/CookbookMauiBlazor.Web.csproj --configuration Release --no-restore &
            wait
          elif [ "$build_api" = "true" ]; then
            dotnet build Cookbook.ApiService/Cookbook.ApiService.csproj --configuration Release --no-restore
          elif [ "$build_web" = "true" ]; then
            dotnet build CookbookMauiBlazor/CookbookMauiBlazor.Web/CookbookMauiBlazor.Web.csproj --configuration Release --no-restore
          else
            echo "No API/Web-related changes detected; skipping build."
          fi

      - name: Lint (format check)
        shell: bash
        run: |
          build_api="${{ steps.detect_projects.outputs.build_api }}"
          build_web="${{ steps.detect_projects.outputs.build_web }}"

          if [ "$build_api" = "true" ] && [ "$build_web" = "true" ]; then
            dotnet format Cookbook.ApiService/Cookbook.ApiService.csproj --verify-no-changes --no-restore &
            api_pid=$!
            dotnet format CookbookMauiBlazor/CookbookMauiBlazor.Web/CookbookMauiBlazor.Web.csproj --verify-no-changes --no-restore &
            web_pid=$!
            failed=0
            wait "$api_pid" || failed=1
            wait "$web_pid" || failed=1
            exit $failed
          elif [ "$build_api" = "true" ]; then
            dotnet format Cookbook.ApiService/Cookbook.ApiService.csproj --verify-no-changes --no-restore
          elif [ "$build_web" = "true" ]; then
            dotnet format CookbookMauiBlazor/CookbookMauiBlazor.Web/CookbookMauiBlazor.Web.csproj --verify-no-changes --no-restore
          else
            echo "No API/Web-related changes detected; skipping format check."
          fi

  test:
    runs-on: ubuntu-latest
    needs: build-lint-test
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Packages.props
            **/NuGet.config
            **/global.json

      - name: Detect test projects
        id: detect_tests
        shell: bash
        run: |
          count=$(find . -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \) | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore test projects
        if: steps.detect_tests.outputs.has_tests == 'true'
        shell: bash
        run: |
          while IFS= read -r proj; do
            dotnet restore "$proj"
          done < <(find . -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \))

      - name: Test
        if: steps.detect_tests.outputs.has_tests == 'true'
        shell: bash
        run: |
          pids=()
          while IFS= read -r proj; do
            dotnet test "$proj" --configuration Release --nologo --no-restore &
            pids+=($!)
          done < <(find . -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \))
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          exit $failed

  detect-docker-changes:
    runs-on: ubuntu-latest
    outputs:
      docker_changed: ${{ steps.filter.outputs.docker }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Docker-related changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - '.dockerignore'

  container-validate:
    needs: detect-docker-changes
    if: needs.detect-docker-changes.outputs.docker_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker images
        run: docker compose build api app

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-lint-test
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Packages.props
            **/NuGet.config
            **/global.json

      - name: Restore integration tests
        run: dotnet restore Cookbook.IntegrationTests/Cookbook.IntegrationTests.csproj

      - name: Run integration tests
        run: dotnet test Cookbook.IntegrationTests/Cookbook.IntegrationTests.csproj --configuration Release --nologo --no-restore --verbosity minimal

  push-api:
    needs: [build-lint-test, test, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Cookbook.ApiService/Dockerfile
          push: true
          tags: benhyer/cookbook-api:${{ github.sha }}
          cache-from: type=registry,ref=benhyer/cookbook-api:cache
          cache-to: type=registry,ref=benhyer/cookbook-api:cache,mode=max

  push-web:
    needs: [build-lint-test, test, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CookbookMauiBlazor/CookbookMauiBlazor.Web/Dockerfile
          push: true
          tags: benhyer/cookbook-web:${{ github.sha }}
          cache-from: type=registry,ref=benhyer/cookbook-web:cache
          cache-to: type=registry,ref=benhyer/cookbook-web:cache,mode=max

  deploy:
    needs: [push-api, push-web]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.push-api.result == 'success' &&
      needs.push-web.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install k6
        run: |
          echo "=== k6 install: checking /tmp/k6 ==="
          ls -la /tmp/k6 2>/dev/null && echo "k6 already present, skipping download" || echo "k6 not found, installing"
          if [ ! -f /tmp/k6 ]; then
            echo "=== Downloading k6 v0.54.0 ==="
            curl -fL --retry 3 --retry-delay 2 \
              https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz \
              -o /tmp/k6.tar.gz
            echo "=== Download complete, size: $(wc -c < /tmp/k6.tar.gz) bytes ==="
            echo "=== Extracting ==="
            tar -xzvf /tmp/k6.tar.gz --strip-components=1 -C /tmp
            rm /tmp/k6.tar.gz
            chmod +x /tmp/k6
          fi
          echo "=== Verifying k6 binary ==="
          /tmp/k6 version

      - name: Apply Kubernetes secrets
        run: |
          kubectl create secret generic cookbook-secrets \
            --namespace cookbook \
            --from-literal=ConnectionStrings__sqldb="${{ secrets.DB_CONNECTION_STRING }}" \
            --from-literal=ConnectionStrings__pgdb="Host=${{ secrets.PG_HOST }};Port=${{ secrets.PG_PORT }};Database=${{ secrets.PG_DB }};Username=${{ secrets.PG_USER }};Password=${{ secrets.PG_PASSWORD }}" \
            --from-literal=AZURE_AD_TENANT_ID="${{ secrets.AZURE_AD_TENANT_ID }}" \
            --from-literal=AZURE_AD_CLIENT_ID="${{ secrets.AZURE_AD_CLIENT_ID }}" \
            --from-literal=AZURE_AD_CLIENT_SECRET="${{ secrets.AZURE_AD_CLIENT_SECRET }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --from-literal=AZURE_STORAGE_CONTAINER_NAME="${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for f in k8s/*.yaml; do
            [ "$(basename $f)" = "secret.yaml" ] && continue
            envsubst '${IMAGE_TAG}' < "$f" | kubectl apply -f -
          done

      - name: Reload observability config
        run: |
          kubectl scale deployment/prometheus -n cookbook --replicas=0
          kubectl wait --for=delete pod -l app=prometheus -n cookbook --timeout=60s
          kubectl scale deployment/prometheus -n cookbook --replicas=1
          kubectl rollout status deployment/prometheus -n cookbook --timeout=60s
          kubectl rollout restart deployment/blackbox -n cookbook
          kubectl rollout restart deployment/grafana -n cookbook

      - name: Start k6 load test
        run: |
          kubectl port-forward -n cookbook svc/prometheus 9090:9090 &
          echo $! > /tmp/pf.pid
          sleep 3
          K6_PROMETHEUS_RW_SERVER_URL=http://localhost:9090/api/v1/write \
            /tmp/k6 run --out experimental-prometheus-rw k6/downtime-test.js &
          echo $! > /tmp/k6.pid
          echo "k6 started (PID $(cat /tmp/k6.pid))"

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/cookbook-api -n cookbook --timeout=120s
          kubectl rollout status deployment/cookbook-web -n cookbook --timeout=120s

      - name: Stop k6 load test
        if: always()
        run: |
          kill $(cat /tmp/k6.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat /tmp/pf.pid 2>/dev/null) 2>/dev/null || true

      - name: Debug failed rollout
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -n cookbook -o wide
          echo "=== API errors (warn/fail/error only) ==="
          for pod in $(kubectl get pods -n cookbook -l app=cookbook-api -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- $pod current ---"
            kubectl logs -n cookbook "$pod" --tail=150 2>&1 | grep -iE '(warn|fail|error|crit|fatal|exception)' | tail -30 || true
            echo "--- $pod previous ---"
            kubectl logs -n cookbook "$pod" --previous --tail=150 2>&1 | grep -iE '(warn|fail|error|crit|fatal|exception)' | tail -30 || true
          done
          echo "=== API events ==="
          kubectl describe pods -n cookbook -l app=cookbook-api | grep -A 10 "^Events:"

      - name: Rollback on failed rollout
        if: failure()
        run: |
          echo "Rolling back deployments..."
          kubectl rollout undo deployment/cookbook-api -n cookbook || true
          kubectl rollout undo deployment/cookbook-web -n cookbook || true

  notify-discord:
    needs:
      [
        build-lint-test,
        test-testproject,
        integration-tests,
        container-validate,
        push-api,
        push-web,
        deploy,
      ]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord notification
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "❌ **Pipeline Failed**",
              "embeds": [
                {
                  "title": "Build Failed",
                  "description": "**Repository:** ${{ github.repository }}\n**Branch:** ${{ github.ref_name }}\n**Commit:** `${{ github.event.head_commit.message }}`\n**Author:** ${{ github.actor }}",
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "color": 15158332,
                  "fields": [
                    {
                      "name": "Workflow",
                      "value": "${{ github.workflow }}",
                      "inline": true
                    }
                  ]
                }
              ]
            }'
