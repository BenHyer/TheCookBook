name: Build MAUI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-maui:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      MAUI_AZUREAD_INSTANCE: ${{ secrets.MAUI_AZUREAD_INSTANCE }}
      MAUI_AZUREAD_TENANT_ID: ${{ secrets.MAUI_AZUREAD_TENANT_ID }}
      MAUI_AZUREAD_CLIENT_ID: ${{ secrets.MAUI_AZUREAD_CLIENT_ID }}
      MAUI_AZUREAD_SCOPES: ${{ secrets.MAUI_AZUREAD_SCOPES }}
      MAUI_API_BASE_URL: ${{ secrets.MAUI_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Packages.props
            **/NuGet.config
            **/global.json

      - name: Install MAUI workload
        shell: pwsh
        run: |
          dotnet workload install maui --ignore-failed-sources

      - name: Write MAUI appsettings.json
        shell: pwsh
        run: |
          $projectPath = Join-Path $env:GITHUB_WORKSPACE "CookbookMauiBlazor\CookbookMauiBlazor\appsettings.json"
          $instance = if ([string]::IsNullOrWhiteSpace($env:MAUI_AZUREAD_INSTANCE)) { "https://ultimatecookbook.ciamlogin.com/" } else { $env:MAUI_AZUREAD_INSTANCE }
          $tenantId = $env:MAUI_AZUREAD_TENANT_ID
          $clientId = $env:MAUI_AZUREAD_CLIENT_ID
          $scopesRaw = $env:MAUI_AZUREAD_SCOPES
          $apiBaseUrl = if ([string]::IsNullOrWhiteSpace($env:MAUI_API_BASE_URL)) { "http://localhost:5346" } else { $env:MAUI_API_BASE_URL }

          $scopes = @()
          if (-not [string]::IsNullOrWhiteSpace($scopesRaw)) {
            $scopes = $scopesRaw -split "," | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          }

          $config = [ordered]@{
            ApiService = @{ BaseUrl = $apiBaseUrl }
            AzureAd = @{
              Instance = $instance
              TenantId = $tenantId
              ClientId = $clientId
              Scopes = $scopes
            }
          }

          $config | ConvertTo-Json -Depth 5 | Set-Content $projectPath -Encoding UTF8

      - name: Restore MAUI app
        run: dotnet restore CookbookMauiBlazor/CookbookMauiBlazor/CookbookMauiBlazor.csproj

      - name: Build MAUI app (Windows)
        run: dotnet build CookbookMauiBlazor/CookbookMauiBlazor/CookbookMauiBlazor.csproj --configuration Release -f net10.0-windows10.0.19041.0 --no-restore

      - name: Build MAUI app (Android)
        run: dotnet build CookbookMauiBlazor/CookbookMauiBlazor/CookbookMauiBlazor.csproj --configuration Release -f net10.0-android --no-restore
