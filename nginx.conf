
server {
    listen 80;
    server_name cookbook.bencampus.duckdns.org;
    
    location /api {
      proxy_pass http://cookbook-api:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
    }
    
    location / {
      proxy_pass http://cookbook-web:80/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
    }
}
   