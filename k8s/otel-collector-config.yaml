apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: cookbook
data:
  otel-config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 10s

    exporters:
      debug:
        verbosity: detailed

      otlphttp:
        endpoint: "http://loki:3100/otlp"

      prometheus:
        endpoint: "0.0.0.0:8889"

    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"   # default port as requested

    service:
      extensions: [health_check]     # added here

      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlphttp]

        metrics:
          receivers: [otlp]
          processors: []
          exporters: [debug, prometheus]
          