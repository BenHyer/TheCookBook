apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: cookbook
data:
  otel-config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 10s

    exporters:
      debug:
        verbosity: detailed

      otlp_http:
        endpoint: "http://loki:3100/otlp"

      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlp_http]

        metrics:
          receivers: [otlp]
          processors: []
          exporters: [debug, prometheus]
