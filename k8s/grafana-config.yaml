apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: cookbook
data:
  loki.yml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        editable: false

  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: PBFA97CFB590B2093
        access: proxy
        url: http://prometheus:9090
        editable: false

  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: TheCookBook
        type: file
        options:
          path: /var/lib/grafana/dashboards
