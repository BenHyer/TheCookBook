apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: cookbook
data:
  loki.yml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        editable: false

  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: PBFA97CFB590B2093
        access: proxy
        url: http://prometheus:9090
        editable: false

  postgres.yml: |
    apiVersion: 1
    datasources:
      - name: PostgreSQL
        type: postgres
        uid: postgres-audit
        url: ${PG_HOST}:${PG_PORT}
        database: ${PG_DB}
        user: ${PG_USER}
        secureJsonData:
          password: ${PG_PASSWORD}
        jsonData:
          sslmode: disable
          maxOpenConns: 5
          maxIdleConns: 2
          connMaxLifetime: 14400
          postgresVersion: 1600
          timescaledb: false
        editable: false

  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: TheCookBook
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
