apiVersion: v1
kind: ConfigMap
metadata:
  name: cookbook-config
  namespace: cookbook
data:
  ASPNETCORE_ENVIRONMENT: Production
  ApiService__BaseUrl: http://cookbook-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  AzureAd__Instance: "https://ultimatecookbook.ciamlogin.com/"
  AzureAd__CallbackPath: "/signin-oidc"
  AzureAd__SignedOutCallbackPath: "/signout-oidc"
  AzureAd__Scopes: "api://133e5a35-ce6c-4e8f-a764-7008bad72271/access_as_user"
  FeatureFlags__EnableUserProfiles: "true"
