apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging   # Start with staging to be safe
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ben.hyer@students.snow.edu          # ← Change to YOUR real email
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
    - http01:
        ingress:
          class: nginx