apiVersion: apps/v1
kind: Deployment
metadata:
  name: cookbook-api
  namespace: cookbook
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cookbook-api
  template:
    metadata:
      labels:
        app: cookbook-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - |
              set -e
              conn="${PG_CONN:-}"
              if [ -z "$conn" ]; then
                echo "PG_CONN is not set"
                exit 1
              fi
              host=$(printf '%s' "$conn" | awk -F';' '{for(i=1;i<=NF;i++){if($i ~ /^Host=/){sub(/^Host=/,"",$i);print $i}}}')
              port=$(printf '%s' "$conn" | awk -F';' '{for(i=1;i<=NF;i++){if($i ~ /^Port=/){sub(/^Port=/,"",$i);print $i}}}')
              db=$(printf '%s' "$conn" | awk -F';' '{for(i=1;i<=NF;i++){if($i ~ /^Database=/){sub(/^Database=/,"",$i);print $i}}}')
              user=$(printf '%s' "$conn" | awk -F';' '{for(i=1;i<=NF;i++){if($i ~ /^Username=/){sub(/^Username=/,"",$i);print $i}}}')
              pass=$(printf '%s' "$conn" | awk -F';' '{for(i=1;i<=NF;i++){if($i ~ /^Password=/){sub(/^Password=/,"",$i);print $i}}}')
              if [ -z "$host" ] || [ -z "$port" ] || [ -z "$db" ] || [ -z "$user" ] || [ -z "$pass" ]; then
                echo "Invalid PG_CONN; expected Host/Port/Database/Username/Password"
                exit 1
              fi
              export PGPASSWORD="$pass"
              echo "Waiting for Postgres at $host:$port/$db"
              while ! pg_isready -h "$host" -p "$port" -U "$user" -d "$db"; do
                echo "$(date) Postgres is not ready yet"
                sleep 5
              done
              echo "Postgres is ready"
          env:
            - name: PG_CONN
              valueFrom:
                secretKeyRef:
                  name: cookbook-secrets
                  key: ConnectionStrings__pgdb
      containers:
        - name: cookbook-api
          image: benhyer/cookbook-api:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: cookbook-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ConnectionStrings__sqldb
              valueFrom:
                secretKeyRef:
                  name: cookbook-secrets
                  key: ConnectionStrings__sqldb
            - name: ConnectionStrings__pgdb
              valueFrom:
                secretKeyRef:
                  name: cookbook-secrets
                  key: ConnectionStrings__pgdb
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: cookbook-secrets
                  key: AZURE_STORAGE_CONNECTION_STRING
            - name: AZURE_STORAGE_CONTAINER_NAME
              valueFrom:
                secretKeyRef:
                  name: cookbook-secrets
                  key: AZURE_STORAGE_CONTAINER_NAME
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: cookbook-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: FeatureFlags__EnableUserProfiles
              valueFrom:
                configMapKeyRef:
                  name: cookbook-config
                  key: FeatureFlags__EnableUserProfiles
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
