apiVersion: apps/v1
kind: Deployment
metadata:
  name: cookbook-api
  namespace: cookbook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cookbook-api
  template:
    metadata:
      labels:
        app: cookbook-api
    spec:
      containers:
        - name: cookbook-api
          image: benhyer/cookbook-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: cookbook-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ConnectionStrings__sqldb
              valueFrom:
                secretKeyRef:
                  name: cookbook-secrets
                  key: ConnectionStrings__sqldb
          # Probes disabled temporarily to see startup logs
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: 8080
          #   initialDelaySeconds: 10
          #   periodSeconds: 10
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: 8080
          #   initialDelaySeconds: 20
          #   periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
