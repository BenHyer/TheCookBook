apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cookbook-ingress
  namespace: cookbook
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "blazor-affinity"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    
    # === NEW: Enable cert-manager + automatic redirect from HTTP to HTTPS ===
    cert-manager.io/cluster-issuer: "letsencrypt-staging"   # Change to "letsencrypt-prod" later
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  
  # === NEW: TLS section ===
  tls:
  - hosts:
    - cookbook.bencampus.duckdns.org
    - cookbook.benhhome.duckdns.org
    secretName: cookbook-tls-secret

  rules:
  - host: cookbook.bencampus.duckdns.org
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cookbook-api
            port:
              number: 80
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cookbook-web
            port:
              number: 80

  - host: cookbook.benhhome.duckdns.org
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cookbook-api
            port:
              number: 80
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cookbook-web
            port:
              number: 80