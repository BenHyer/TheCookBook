apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cookbook-ingress
  namespace: cookbook
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "blazor-affinity"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: cookbook.bencampus.duckdns.org
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cookbook-api
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cookbook-web
            port:
              number: 80
  - host: cookbook.benhhome.duckdns.org
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cookbook-api
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cookbook-web
            port:
              number: 80

