apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    uid: postgres-audit
    url: postgres:5432
    database: ${PG_DB}
    user: ${PG_USER}
    secureJsonData:
      password: ${PG_PASSWORD}
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    editable: false
