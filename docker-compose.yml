services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cookbook-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-ChangeThisPassword_123!}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Cookbook.ApiService/Dockerfile
    container_name: cookbook-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__sqldb: Server=db,1433;Database=${DB_NAME:-sqldb};User Id=sa;Password=${DB_PASSWORD:-ChangeThisPassword_123!};TrustServerCertificate=True;Encrypt=False;
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: CookbookMauiBlazor/CookbookMauiBlazor.Web/Dockerfile
    container_name: cookbook-app
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      ApiService__BaseUrl: http://api:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AzureAd__Instance: ${AZURE_AD_INSTANCE:-}
      AzureAd__TenantId: ${AZURE_AD_TENANT_ID:-}
      AzureAd__ClientId: ${AZURE_AD_CLIENT_ID:-}
      AzureAd__ClientSecret: ${AZURE_AD_CLIENT_SECRET:-}
      AzureAd__CallbackPath: /signin-oidc
      AzureAd__SignedOutCallbackPath: /signout-oidc
    ports:
      - "${APP_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: cookbook-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - loki
    volumes:
      - ./config/otel-config.yml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "8889"

  prometheus:
    image: prom/prometheus:latest
    container_name: cookbook-prometheus
    depends_on:
      - otel-collector
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: cookbook-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki.yaml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: cookbook-grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=5s
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  db_data:
